{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block container_class %}dashboard-container{% endblock %}

{% block content %}
<div class="card">
    <h2>Welcome, {{ name }}!</h2>
    <p style="margin-bottom: 20px;">You have successfully logged in.</p>

</div>
{% endblock %}
